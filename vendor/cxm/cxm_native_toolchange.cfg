# CXM native CxChanger XY motion - commissioning only
# Do NOT include the original toolchange-EN.cfg: its old dock XY, heaters,
# Z hop, sensor pins and unconditional tool state restore do not match CXM.
# Geometry must be synchronized from the accepted schema-3 CXM datastore.
# Installed by scripts/cxm_native_install.py after dry-run and backup.
#
# Klipper owns every physical pickup/dropoff instruction. No Python G1 scripts.
# This is NOT a production print toolchanger (heater/offset integration pending).

[gcode_macro _CXM_NATIVE]
description: Native CxChanger geometry and state; invalid until synced
variable_protocol: 2
variable_four_move_revision: 6
variable_jog_revision: 2
variable_camera_reference: [0,0,0,0]
variable_ready: 0
variable_revision: ""
variable_tool_count: 0
variable_shift_x: 4.4
variable_dodge_y: 14.0
variable_clearance_y: 100.0
variable_travel_feed: 6000
variable_approach_feed: 6000
variable_latch_feed: 6000
variable_profile: "standard"
variable_segmented: 0
variable_margin_y: 15.0
variable_current_tool: -2
variable_fault: 1
variable_t0_x: -1.0
variable_t0_y: -1.0
variable_t0_accepted: 0
variable_t1_x: -1.0
variable_t1_y: -1.0
variable_t1_accepted: 0
variable_t2_x: -1.0
variable_t2_y: -1.0
variable_t2_accepted: 0
variable_t3_x: -1.0
variable_t3_y: -1.0
variable_t3_accepted: 0
variable_t4_x: -1.0
variable_t4_y: -1.0
variable_t4_accepted: 0
variable_t5_x: -1.0
variable_t5_y: -1.0
variable_t5_accepted: 0
variable_t6_x: -1.0
variable_t6_y: -1.0
variable_t6_accepted: 0
variable_t7_x: -1.0
variable_t7_y: -1.0
variable_t7_accepted: 0
variable_t8_x: -1.0
variable_t8_y: -1.0
variable_t8_accepted: 0
variable_t9_x: -1.0
variable_t9_y: -1.0
variable_t9_accepted: 0
variable_t10_x: -1.0
variable_t10_y: -1.0
variable_t10_accepted: 0
variable_t11_x: -1.0
variable_t11_y: -1.0
variable_t11_accepted: 0
gcode:
    RESPOND TYPE=echo MSG="CXM native state: loaded={printer['gcode_macro _CXM_NATIVE'].ready} current={printer['gcode_macro _CXM_NATIVE'].current_tool}"

# State -2 means UNKNOWN, -1 confirmed EMPTY; never restore physical tool
# identity from save_variables at Klipper startup.
[gcode_macro CXM_MANUAL_DOCK_JOG]
description: Supervised motor-on dock alignment; only Klipper issues physical G1
gcode:
    {% set axis=params.AXIS|default("")|upper %}
    {% set dist=params.DIST|default(0)|float %}
    {% set t=params.TOOL|default(-1)|int %}
    {% set head=printer.toolhead %}
    {% set pos=head.position %}
    {% set motors=printer.stepper_enable.steppers %}
    {% set run=printer["gcode_macro _CXM_TEST_STATE"] %}
    {% if axis not in ("X","Y","Z") or dist|abs not in (0.001,0.01,0.1,1.0,10.0) or (axis == "Z" and dist|abs not in (0.01,0.1,1.0)) %}
      {action_raise_error("CXM calibration: unsupported jog axis or step")}
    {% elif t < 0 or t > 11 %}
      {action_raise_error("CXM calibration: invalid selected tool")}
    {% elif "x" not in head.homed_axes or "y" not in head.homed_axes or "z" not in head.homed_axes %}
      {action_raise_error("CXM calibration: home XYZ before jogging")}
    {% elif pos.z|float < 20.0 %}
      {action_raise_error("CXM calibration: raise Z to 20 mm clearance first")}
    {% elif run.running|int != 0 %}
      {action_raise_error("CXM calibration: native tool test running")}
    {% elif printer["gcode_button cxm_tool_detect"].state != "PRESSED" %}
      {action_raise_error("CXM calibration: mounted hotend required")}
    {% elif "virtual_sdcard" in printer and printer.virtual_sdcard.is_active %}
      {action_raise_error("CXM calibration: cannot jog during active print")}
    {% elif "pause_resume" in printer and printer.pause_resume.is_paused %}
      {action_raise_error("CXM calibration: cannot jog a paused print")}
    {% elif "print_stats" in printer and printer.print_stats.state not in (none,"standby","complete","cancelled","error") %}
      {action_raise_error("CXM calibration: printer is busy")}
    {% endif %}
    {% for motor in ("stepper_x","stepper_y","stepper_z","stepper_z1","stepper_z2","stepper_z3") %}
      {% if motor not in motors or motors[motor] != True %}
        {action_raise_error("CXM calibration: disabled motor " ~ motor)}
      {% endif %}
    {% endfor %}
    {% if axis == "X" %}
      {% set next=pos.x|float+dist %}
      {% set lo=head.axis_minimum.x|float+1.0 %}
      {% set hi=head.axis_maximum.x|float-1.0 %}
    {% elif axis == "Y" %}
      {% set next=pos.y|float+dist %}
      {% set lo=head.axis_minimum.y|float+1.0 %}
      {% set hi=head.axis_maximum.y|float-1.0 %}
    {% else %}
      {% set next=pos.z|float+dist %}
      {% set lo=[20.0,head.axis_minimum.z|float+1.0]|max %}
      {% set hi=head.axis_maximum.z|float-1.0 %}
    {% endif %}
    {% if next < lo or next > hi %}
      {action_raise_error("CXM calibration: jog exceeds guarded axis travel")}
    {% endif %}
    SAVE_GCODE_STATE NAME=CXM_MANUAL_JOG
    G91
    {% set camera=params.CAMERA|default(0)|int == 1 %}
    {% set feed=(180 if camera else 60) if axis == "Z" else (1200 if camera else 3000) %}
    G1 {axis}{dist} F{feed}
    M400
    RESTORE_GCODE_STATE NAME=CXM_MANUAL_JOG MOVE=0

[gcode_macro _CXM_PREPARE_CLEARANCE]
description: Verify existing clearance before any docking move
gcode:
    {% set expected=params.EXPECT|default("")|upper %}
    {% set homed=printer.toolhead.homed_axes %}
    {% if expected not in ("PRESSED","RELEASED") %}
      {action_raise_error("CXM: invalid carriage sensor expectation")}
    {% elif "x" not in homed or "y" not in homed or "z" not in homed %}
      {action_raise_error("CXM: XYZ not homed; automatic clearance lift refused")}
    {% elif printer["gcode_button cxm_tool_detect"].state != expected %}
      {action_raise_error("CXM: carriage sensor disagrees with declared tool state")}
    {% elif printer.toolhead.axis_maximum.z|float < 25.0 %}
      {action_raise_error("CXM: configured Z maximum is below safe 25 mm height")}
    {% elif "virtual_sdcard" in printer and printer.virtual_sdcard.is_active %}
      {action_raise_error("CXM: printer is currently printing")}
    {% elif "pause_resume" in printer and printer.pause_resume.is_paused %}
      {action_raise_error("CXM: printer is paused")}
    {% elif "print_stats" in printer and printer.print_stats.state not in (none,"standby","complete","cancelled","error") %}
      {action_raise_error("CXM: active print; cannot prepare clearance")}
    {% endif %}
    {% set gm=printer.gcode_move %}
    {% if ((gm.position.z|float - gm.gcode_position.z|float)|abs > 0.02) %}
      {action_raise_error("CXM: active Z coordinate offset; automatic lift refused")}
    {% endif %}
    {% set motors=printer.stepper_enable.steppers %}
    {% for name in ("stepper_x","stepper_y","stepper_z","stepper_z1","stepper_z2","stepper_z3") %}
      {% if name not in motors or motors[name] != True %}
        {action_raise_error("CXM: motor disabled during clearance check: " ~ name)}
      {% endif %}
    {% endfor %}
    {% if printer.toolhead.position.z|float < 25.0 %}
      {action_raise_error("CXM: establish Z clearance of at least 25 mm before starting")}
    {% endif %}
    CXM_FAST_VERIFY EXPECT={expected}

[gcode_macro _CXM_STAGE_TEST]
description: Automatic guarded Y staging only when EMPTY carriage is already clear of dock hardware
gcode:
    {% set st=printer["gcode_macro _CXM_NATIVE"] %}
    {% set target=params.Y|float %}
    {% set dock_y=params.DOCK_Y|float %}
    {% set pos=printer.toolhead.position %}
    {% set min_clear=dock_y + st.dodge_y|float + st.margin_y|float %}
    {% if st.ready|int != 1 or st.fault|int != 0 or st.current_tool|int != -1 %}
      {action_raise_error("CXM: cannot stage until carriage is verified EMPTY and ready")}
    {% elif printer["gcode_button cxm_tool_detect"].state != "RELEASED" %}
      {action_raise_error("CXM: staging sensor disagrees with EMPTY carriage")}
    {% elif target < min_clear + 8.0 or target > printer.toolhead.axis_maximum.y|float %}
      {action_raise_error("CXM: requested staging Y is outside safe geometry")}
    {% elif pos.y|float < min_clear - 0.2 %}
      {action_raise_error("CXM: below dock mechanical clearance Y; no automatic movement possible from this position")}
    {% elif pos.x|float < 5.0 or pos.x|float > 325.0 %}
      {action_raise_error("CXM: X outside verified transfer region; cannot auto-stage")}
    {% endif %}
    {% if pos.y|float < target - 0.001 %}
      {action_raise_error("CXM: start on or above the clear staging line")}
    {% endif %}
    CXM_FAST_VERIFY EXPECT=RELEASED MIN_Y={target}

[gcode_macro CXM_DECLARE_CARRIAGE]
description: Explicit physical carriage identity; guarded Z lift and four sensor confirmations
gcode:
    {% set st=printer["gcode_macro _CXM_NATIVE"] %}
    {% set t=params.TOOL|default(-2)|int %}
    {% if st.ready|int != 1 %}
      {action_raise_error("CXM: accepted XY geometry not synchronized")}
    {% elif t < -1 or t >= st.tool_count|int %}
      {action_raise_error("CXM: invalid declared tool number")}
    {% elif t>=0 and st["t" ~ t ~ "_accepted"]|int != 1 %}
      {action_raise_error("CXM: declared tool lacks accepted dock calibration")}
    {% elif st.current_tool|int >= -1 and st.fault|int == 0 and st.current_tool|int != t %}
      {action_raise_error("CXM: existing verified tool identity differs; use normal toolchange or inspect fault")}
    {% endif %}
    {% if t == -1 %}
      _CXM_PREPARE_CLEARANCE EXPECT=RELEASED
      CXM_FAST_VERIFY EXPECT=RELEASED
      G4 P150
      M400
      CXM_FAST_VERIFY EXPECT=RELEASED
      G4 P80
      M400
      CXM_FAST_VERIFY EXPECT=RELEASED
      G4 P80
      M400
      CXM_FAST_VERIFY EXPECT=RELEASED
    {% else %}
      _CXM_PREPARE_CLEARANCE EXPECT=PRESSED
      CXM_FAST_VERIFY EXPECT=PRESSED
      G4 P150
      M400
      CXM_FAST_VERIFY EXPECT=PRESSED
      G4 P80
      M400
      CXM_FAST_VERIFY EXPECT=PRESSED
      G4 P80
      M400
      CXM_FAST_VERIFY EXPECT=PRESSED
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_CXM_NATIVE VARIABLE=current_tool VALUE={t}
    SET_GCODE_VARIABLE MACRO=_CXM_NATIVE VARIABLE=fault VALUE=0
    RESPOND TYPE=echo MSG="CXM carriage declared T{t}; sensor and clearance verified"

[gcode_macro CXM_CONFIRM_EMPTY]
description: Legacy EMPTY confirmation; safely lifts Z to 25 mm when needed
gcode:
    CXM_DECLARE_CARRIAGE TOOL=-1

[gcode_macro _CXM_CHECK_TOOL]
description: Fail-closed accepted coordinate and limits check
gcode:
    {% set st=printer["gcode_macro _CXM_NATIVE"] %}
    {% set t=params.TOOL|int %}
    {% if st.ready|int != 1 or st.fault|int != 0 %}
      {action_raise_error("CXM: native state not ready or latched fault")}
    {% endif %}
    {% if t < 0 or t >= st.tool_count|int or st["t" ~ t ~ "_accepted"]|int != 1 %}
      {action_raise_error("CXM: tool datum not accepted/synced")}
    {% endif %}
    {% set x=st["t" ~ t ~ "_x"]|float %}
    {% set y=st["t" ~ t ~ "_y"]|float %}
    {% set safe=y+st.clearance_y|float %}
    {% if x<10 or x>325 or y<10 or y>320 or safe>362 or x+st.shift_x|float>325 or st.shift_x|float<=0 %}
      {action_raise_error("CXM: dock geometry outside guarded XY bounds")}
    {% elif st.segmented|int == 1 and y+st.dodge_y|float+st.margin_y|float>safe-8 %}
      {action_raise_error("CXM: fast clearance waypoint too close to staging line")}
    {% endif %}

[gcode_macro _CXM_VERIFY]
description: Two stable post-movement sensor checks with 30 ms debounce
gcode:
    {% set expect=params.EXPECT|upper %}
    {% set st=printer["gcode_macro _CXM_NATIVE"] %}
    {% set t=params.TOOL|int %}
    {% set x=st["t" ~ t ~ "_x"]|float %}
    {% set y=st["t" ~ t ~ "_y"]|float + st.clearance_y|float %}
    {% set final_x=(x+st.shift_x|float)|round(5) if expect == "PRESSED" else x %}
    M400
    CXM_FAST_VERIFY EXPECT={expect} X={final_x} Y={y}
    G4 P30
    CXM_FAST_VERIFY EXPECT={expect} X={final_x} Y={y}

[delayed_gcode CXM_ACCEL_RESTORE]
gcode:
    SET_VELOCITY_LIMIT ACCEL=4000
    RESPOND TYPE=echo MSG="CXM acceleration restored to 4000 by fallback guard"

[gcode_macro _CXM_CLEAR_TRANSFER]
description: Validate four-move staging without moving the carriage
gcode:
    {% set st=printer["gcode_macro _CXM_NATIVE"] %}
    {% set t=params.TOOL|int %}
    {% set expect=params.EXPECT %}
    {% set pos=printer.toolhead.position %}
    {% set gm=printer.gcode_move %}
    {% set x=st["t" ~ t ~ "_x"]|float %}
    {% set y=st["t" ~ t ~ "_y"]|float %}
    {% set safe=y+st.clearance_y|float %}
    {% set xmax=printer.toolhead.axis_maximum.x|float %}
    {% set ymax=printer.toolhead.axis_maximum.y|float %}
    {% if st.ready|int != 1 or st.fault|int != 1 or st["t" ~ t ~ "_accepted"]|int != 1 %}
      {action_raise_error("CXM: synchronized accepted geometry required")}
    {% elif (gm.speed_factor|float-1)|abs > 0.0001 %}
      {action_raise_error("CXM: select 100 percent speed override for the four-move path")}
    {% elif (pos.x-gm.gcode_position.x)|abs > 0.02 or (pos.y-gm.gcode_position.y)|abs > 0.02 or "skew_correction" in printer %}
      {action_raise_error("CXM: restore untransformed machine XY before docking")}
    {% elif (st.shift_x|float-4.4)|abs > 0.00001 or (st.clearance_y|float-100)|abs > 0.00001 %}
      {action_raise_error("CXM: expected measured +4.4 X latch and 100 mm Y clearance")}
    {# All T0–T11 XY dock positions are read from accepted saved calibration,
       never hard-coded from the previous physical dock layout. #}
    {% elif pos.y < safe-0.001 or safe > ymax or x+4.4 > xmax or pos.x < 5 or pos.x > 325 %}
      {action_raise_error("CXM: start in the clear staging area; check machine limits")}
    {% endif %}
    CXM_FAST_VERIFY EXPECT={expect}

[gcode_macro _CXM_PICKUP_MOTION]
description: Verified T0 baseline - approach saved dock X, engage X+, retreat Y+
gcode:
    {% set st=printer["gcode_macro _CXM_NATIVE"] %}
    {% set t=params.TOOL|int %}
    {% set x=st["t" ~ t ~ "_x"]|float %}
    {% set y=st["t" ~ t ~ "_y"]|float %}
    {% set mounted=(x+st.shift_x|float)|round(5) %}
    {% set safe=y+st.clearance_y|float %}
    {% set trial=printer["gcode_macro _CXM_TEST_STATE"].running|int == 1 %}
    _CXM_CLEAR_TRANSFER TOOL={t} EXPECT=RELEASED
    SAVE_GCODE_STATE NAME=CXM_PICKUP_TEST
    G90
    G1 X{x|round(5)} Y{safe|round(5)} F{st.travel_feed if trial else 6000}
    G1 Y{y|round(5)} F{st.approach_feed if trial else 6000}
    G1 X{mounted|round(5)} F{st.latch_feed if trial else 6000}
    G1 Y{safe|round(5)} F{st.approach_feed if trial else 6000}
    M400
    RESTORE_GCODE_STATE NAME=CXM_PICKUP_TEST MOVE=0
    _CXM_VERIFY EXPECT=PRESSED TOOL={t}

[gcode_macro _CXM_RELEASE_MOTION]
description: Verified T0 baseline - enter on mounted X, release X-, retreat Y+
gcode:
    {% set st=printer["gcode_macro _CXM_NATIVE"] %}
    {% set t=params.TOOL|int %}
    {% set x=st["t" ~ t ~ "_x"]|float %}
    {% set y=st["t" ~ t ~ "_y"]|float %}
    {% set mounted=(x+st.shift_x|float)|round(5) %}
    {% set safe=y+st.clearance_y|float %}
    {% set trial=printer["gcode_macro _CXM_TEST_STATE"].running|int == 1 %}
    _CXM_CLEAR_TRANSFER TOOL={t} EXPECT=PRESSED
    SAVE_GCODE_STATE NAME=CXM_DROPOFF_TEST
    G90
    G1 X{mounted|round(5)} Y{safe|round(5)} F{st.travel_feed if trial else 6000}
    G1 Y{y|round(5)} F{st.approach_feed if trial else 6000}
    G1 X{x|round(5)} F{st.latch_feed if trial else 6000}
    G1 Y{safe|round(5)} F{st.approach_feed if trial else 6000}
    M400
    RESTORE_GCODE_STATE NAME=CXM_DROPOFF_TEST MOVE=0
    _CXM_VERIFY EXPECT=RELEASED TOOL={t}

[gcode_macro CXM_CALIBRATION_RELEASE]
description: Seated start is outside the measured four-move path
gcode:
    {action_raise_error("CXM: four-move drop-off must start with mounted tool in clear staging area")}

[gcode_macro _CXM_COMMIT_STATE]
description: Commit only after motion and verified sensor
gcode:
    {% set t=params.TOOL|int %}
    {% set st=printer["gcode_macro _CXM_NATIVE"] %}
    {% if t == -1 %}
      CXM_FAST_VERIFY EXPECT=RELEASED
    {% else %}
      CXM_FAST_VERIFY EXPECT=PRESSED X={(st["t" ~ t ~ "_x"]|float+st.shift_x|float)|round(5)} Y={st["t" ~ t ~ "_y"]|float+st.clearance_y|float}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_CXM_NATIVE VARIABLE=current_tool VALUE={t}
    SET_GCODE_VARIABLE MACRO=_CXM_NATIVE VARIABLE=fault VALUE=0

[gcode_macro CXM_SELECT_TOOL]
description: CXM central native hotend change controller; TOOL=-1 unload
gcode:
    {% set st=printer["gcode_macro _CXM_NATIVE"] %}
    {% set target=params.TOOL|default(-2)|int %}
    {% set old=st.current_tool|int %}
    {% set pos=printer.toolhead.position %}
    {% set old_safe=(st["t" ~ old ~ "_y"]|float + st.clearance_y|float) if old>=0 else -1 %}
    {% set target_safe=(st["t" ~ target ~ "_y"]|float + st.clearance_y|float) if target>=0 else -1 %}
    {% if st.ready|int != 1 or st.fault|int != 0 or old < -1 %}
      {action_raise_error("CXM: native tool state unknown/not commissioned. Inspect and confirm EMPTY first")}
    {% elif target < -1 or target >= st.tool_count|int %}
      {action_raise_error("CXM: requested tool out of range")}
    {% elif old >= 0 and pos.y|float < old_safe - 0.2 %}
      {action_raise_error("CXM: toolchange start is inside the active dock approach")}
    {% elif old == -1 and target>=0 and pos.y|float < target_safe - 1.0 %}
      {action_raise_error("CXM: empty carriage is more than 1 mm inside target safe-Y staging line")}
    {% elif old>=0 and target>=0 and (old_safe-target_safe)|abs > 1.0 %}
      {action_raise_error("CXM: cross-dock transfer lines differ by more than 1 mm")}
    {% elif target == old %}
      {% if old == -1 %}
        _CXM_PREPARE_CLEARANCE EXPECT=RELEASED
      {% else %}
        _CXM_PREPARE_CLEARANCE EXPECT=PRESSED
      {% endif %}
      RESPOND TYPE=echo MSG="CXM: requested tool already selected (sensor checked)"
    {% else %}
      _CXM_PREPARE_CLEARANCE EXPECT={'PRESSED' if old >= 0 else 'RELEASED'}
      {% if old >= 0 %}
        _CXM_CHECK_TOOL TOOL={old}
      {% endif %}
      {% if target >= 0 %}
        _CXM_CHECK_TOOL TOOL={target}
      {% endif %}
      {% if old >= 0 %}
        SET_GCODE_VARIABLE MACRO=_CXM_NATIVE VARIABLE=fault VALUE=1
        _CXM_RELEASE_MOTION TOOL={old}
        _CXM_COMMIT_STATE TOOL=-1
      {% else %}
        CXM_FAST_VERIFY EXPECT=RELEASED
      {% endif %}
      {% if target >= 0 %}
        SET_GCODE_VARIABLE MACRO=_CXM_NATIVE VARIABLE=fault VALUE=1
        _CXM_PICKUP_MOTION TOOL={target}
        _CXM_COMMIT_STATE TOOL={target}
      {% endif %}
    {% endif %}

[gcode_macro CXM_SPEED_REPORT]
description: Report live limits and isolated-move peak speed estimates without moving
gcode:
    {% set st=printer["gcode_macro _CXM_NATIVE"] %}
    {% set head=printer.toolhead %}
    {% set a=head.max_accel|float %}
    {% set vmax=head.max_velocity|float %}
    {% set ratio=head.minimum_cruise_ratio|float %}
    RESPOND TYPE=echo MSG="CXM live limits: V={vmax} mm/s A={a} mm/s^2 minimum cruise ratio={ratio} square corner velocity={head.square_corner_velocity} mm/s"
    {% if not st.ready|int %}
      RESPOND TYPE=echo MSG="Native dock geometry has not been synchronized. Run this report again after normal empty-carriage setup."
    {% else %}
      {% set factor=a*(1-ratio) %}
      {% set clearance=st.clearance_y|float %}
      {% set latch=st.shift_x|float|abs %}
      RESPOND TYPE=echo MSG="Estimated peaks assuming zero entry and exit speed; mechanical grip and missed steps are not modeled."
      RESPOND TYPE=echo MSG="Y entry/withdrawal {clearance} mm: {([vmax,(factor*clearance)**0.5]|min)|round(1)} mm/s. X latch {latch} mm: {([vmax,(factor*latch)**0.5]|min)|round(1)} mm/s."
      {% for i in range(st.tool_count|int) if st["t" ~ i ~ "_accepted"]|int %}
        {% for j in range(i+1,st.tool_count|int) if st["t" ~ j ~ "_accepted"]|int %}
          {% set dx=st["t" ~ i ~ "_x"]|float-st["t" ~ j ~ "_x"]|float %}
          {% set dy=st["t" ~ i ~ "_y"]|float-st["t" ~ j ~ "_y"]|float %}
          {% set dist=(dx*dx+dy*dy)**0.5 %}
          RESPOND TYPE=echo MSG="Staging T{i} to T{j}, {dist|round(2)} mm: {([vmax,(factor*dist)**0.5]|min)|round(1)} mm/s."
        {% endfor %}
      {% endfor %}
    {% endif %}

[gcode_macro CXM_SET_PROFILE]
description: Select existing CXM motion speeds without changing geometry
gcode:
    {% set mode=params.PROFILE|default("")|lower %}
    {% set st=printer["gcode_macro _CXM_NATIVE"] %}
    {% set test=printer["gcode_macro _CXM_TEST_STATE"] %}
    {% set speeds={"standard":(100,100,100), "faster":(30,4,3),
                  "performance":(80,8,3), "sprint":(200,40,10),
                  "race":(400,80,20), "boost":(600,120,40)} %}
    {% if mode not in speeds and mode != "custom" %}
      {action_raise_error("CXM: unrecognized four-move speed profile")}
    {% elif st.current_tool|int != -1 or test.running|int != 0 or st.fault|int != 0 or st.ready|int != 1 %}
      {action_raise_error("CXM: speed changes require synced READY, confirmed EMPTY carriage and idle test")}
    {% endif %}
    {% if mode == "custom" %}
      {% set travel=params.TRAVEL|default(-1)|float %}
      {% set approach=params.APPROACH|default(-1)|float %}
      {% set latch=params.LATCH|default(-1)|float %}
      {% if not (10 <= travel <= 1200 and 1 <= approach <= 600 and 1 <= latch <= 300 and travel >= approach >= latch) %}
        {action_raise_error("CXM Custom: travel 10-1200, approach 1-600, latch 1-300 mm/s; require travel >= approach >= latch")}
      {% endif %}
      {% set selected=(travel,approach,latch) %}
    {% else %}
      {% set selected=speeds[mode] %}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_CXM_NATIVE VARIABLE=travel_feed VALUE={selected[0]*60}
    SET_GCODE_VARIABLE MACRO=_CXM_NATIVE VARIABLE=approach_feed VALUE={selected[1]*60}
    SET_GCODE_VARIABLE MACRO=_CXM_NATIVE VARIABLE=latch_feed VALUE={selected[2]*60}
    SET_GCODE_VARIABLE MACRO=_CXM_NATIVE VARIABLE=segmented VALUE=0
    SET_GCODE_VARIABLE MACRO=_CXM_NATIVE VARIABLE=margin_y VALUE=15
    SET_GCODE_VARIABLE MACRO=_CXM_NATIVE VARIABLE=profile VALUE="'{mode}'"
    RESPOND TYPE=echo MSG="CXM motion profile: {mode}"

[gcode_macro _CXM_TEST_STATE]
description: Native supervised cycle status
variable_running: 0
variable_stop: 0
variable_index: 0
variable_cycles: 0
variable_completed: 0
variable_tool_a: -1
variable_tool_b: -1
variable_tool_c: -1
variable_state: "idle"
gcode:
    RESPOND TYPE=echo MSG="CXM native test: {printer['gcode_macro _CXM_TEST_STATE'].running}"

[gcode_macro CXM_TEST_START]
description: Start native one- to three-tool test, completed tool pairs only
gcode:
    {% set st=printer["gcode_macro _CXM_TEST_STATE"] %}
    {% set native=printer["gcode_macro _CXM_NATIVE"] %}
    {% set a=params.A|default(-1)|int %}
    {% set b=params.B|default(-1)|int %}
    {% set c=params.C|default(-1)|int %}
    {% set n=params.CYCLES|default(1)|int %}
    {% if st.running|int == 1 or native.ready|int != 1 or native.fault|int != 0 or native.current_tool|int != -1 %}
      {action_raise_error("CXM: test busy, unsynced, faulted or carriage not confirmed EMPTY")}
    {% elif a<0 or a>=native.tool_count|int or (b != -1 and (b<=a or b>=native.tool_count|int)) or (c != -1 and (b<0 or c<=b or c>=native.tool_count|int)) or n<1 or n>20 %}
      {action_raise_error("CXM: invalid ordered 1-3 tool cycle parameters")}
    {% endif %}
    _CXM_CHECK_TOOL TOOL={a}
    {% if b >= 0 %}
      _CXM_CHECK_TOOL TOOL={b}
    {% endif %}
    {% if c >= 0 %}
      _CXM_CHECK_TOOL TOOL={c}
    {% endif %}
    {% set y_a=native["t" ~ a ~ "_y"]|float+native.clearance_y|float %}
    {% set y_b=native["t" ~ b ~ "_y"]|float+native.clearance_y|float if b>=0 else y_a %}
    {% set y_c=native["t" ~ c ~ "_y"]|float+native.clearance_y|float if c>=0 else y_b %}
    {% if (([y_a,y_b,y_c]|max) - ([y_a,y_b,y_c]|min)) > 1.0 %}
      {action_raise_error("CXM: selected dock safe-Y lines differ by more than 1 mm")}
    {% endif %}
    _CXM_PREPARE_CLEARANCE EXPECT=RELEASED
    _CXM_STAGE_TEST Y={([y_a,y_b,y_c]|max)} DOCK_Y={([y_a,y_b,y_c]|max) - native.clearance_y|float}
    SET_GCODE_VARIABLE MACRO=_CXM_TEST_STATE VARIABLE=tool_a VALUE={a}
    SET_GCODE_VARIABLE MACRO=_CXM_TEST_STATE VARIABLE=tool_b VALUE={b}
    SET_GCODE_VARIABLE MACRO=_CXM_TEST_STATE VARIABLE=tool_c VALUE={c}
    SET_GCODE_VARIABLE MACRO=_CXM_TEST_STATE VARIABLE=state VALUE="'running'"
    SET_GCODE_VARIABLE MACRO=_CXM_TEST_STATE VARIABLE=cycles VALUE={n}
    SET_GCODE_VARIABLE MACRO=_CXM_TEST_STATE VARIABLE=completed VALUE=0
    SET_GCODE_VARIABLE MACRO=_CXM_TEST_STATE VARIABLE=index VALUE=0
    SET_GCODE_VARIABLE MACRO=_CXM_TEST_STATE VARIABLE=stop VALUE=0
    SET_GCODE_VARIABLE MACRO=_CXM_TEST_STATE VARIABLE=running VALUE=1
    UPDATE_DELAYED_GCODE ID=CXM_NATIVE_TEST_STEP DURATION=0.01

[gcode_macro CXM_TEST_STOP]
description: Request stop after current completed pickup+dropoff pair
gcode:
    SET_GCODE_VARIABLE MACRO=_CXM_TEST_STATE VARIABLE=stop VALUE=1

[gcode_macro CXM_RECOVER]
description: Operator-confirmed physical EMPTY recovery, even if stale recorded identity disagrees
gcode:
    {% set native=printer["gcode_macro _CXM_NATIVE"] %}
    {% set confirmed=params.CONFIRM|default("")|upper %}
    {% if confirmed != "EMPTY" %}
      {action_raise_error("CXM RECOVER: physically inspect docks and carriage, then run CXM_RECOVER CONFIRM=EMPTY")}
    {% elif native.ready|int != 1 %}
      {action_raise_error("CXM RECOVER: dock geometry not synchronized")}
    {% elif printer["gcode_button cxm_tool_detect"].state != "RELEASED" %}
      {action_raise_error("CXM RECOVER: sensor is not RELEASED; inspect hotend attachment")}
    {% elif "x" not in printer.toolhead.homed_axes or "y" not in printer.toolhead.homed_axes or "z" not in printer.toolhead.homed_axes %}
      {action_raise_error("CXM RECOVER: home XYZ and inspect carriage before recovery")}
    {% elif "virtual_sdcard" in printer and printer.virtual_sdcard.is_active %}
      {action_raise_error("CXM RECOVER: printer is printing")}
    {% elif "pause_resume" in printer and printer.pause_resume.is_paused %}
      {action_raise_error("CXM RECOVER: printer is paused")}
    {% elif "print_stats" in printer and printer.print_stats.state not in (none,"standby","complete","cancelled","error") %}
      {action_raise_error("CXM RECOVER: active print")}
    {% endif %}
    UPDATE_DELAYED_GCODE ID=CXM_NATIVE_TEST_STEP DURATION=0
    CXM_TEST_RESET
    _CXM_PREPARE_CLEARANCE EXPECT=RELEASED
    CXM_FAST_VERIFY EXPECT=RELEASED
    G4 P150
    M400
    CXM_FAST_VERIFY EXPECT=RELEASED
    G4 P80
    M400
    CXM_FAST_VERIFY EXPECT=RELEASED
    G4 P80
    M400
    CXM_FAST_VERIFY EXPECT=RELEASED
    SET_GCODE_VARIABLE MACRO=_CXM_NATIVE VARIABLE=current_tool VALUE=-1
    SET_GCODE_VARIABLE MACRO=_CXM_NATIVE VARIABLE=fault VALUE=0
    SET_VELOCITY_LIMIT ACCEL=4000
    UPDATE_DELAYED_GCODE ID=CXM_ACCEL_RESTORE DURATION=0
    RESPOND TYPE=echo MSG="CXM RECOVER complete: EMPTY sensor verified, recorded tool reconciled to -1, fault cleared, acceleration 4000"

[gcode_macro CXM_TEST_RESET]
description: Clear stopped/uncertain native test only after physical EMPTY inspection
gcode:
    {% set native=printer["gcode_macro _CXM_NATIVE"] %}
    {% if native.ready|int != 1 %}
      {action_raise_error("CXM: native geometry not synchronized")}
    {% endif %}
    CXM_FAST_VERIFY EXPECT=RELEASED
    M400
    SET_GCODE_VARIABLE MACRO=_CXM_TEST_STATE VARIABLE=running VALUE=0
    SET_GCODE_VARIABLE MACRO=_CXM_TEST_STATE VARIABLE=stop VALUE=0
    SET_GCODE_VARIABLE MACRO=_CXM_TEST_STATE VARIABLE=state VALUE="'idle'"
    UPDATE_DELAYED_GCODE ID=CXM_NATIVE_TEST_STEP DURATION=0

[delayed_gcode CXM_NATIVE_TEST_STEP]
gcode:
    {% set st=printer["gcode_macro _CXM_TEST_STATE"] %}
    {% if st.running|int == 1 %}
      {% if st.stop|int == 1 or st.completed|int >= st.cycles|int %}
        SET_GCODE_VARIABLE MACRO=_CXM_TEST_STATE VARIABLE=running VALUE=0
        {% if st.stop|int == 1 %}
          SET_GCODE_VARIABLE MACRO=_CXM_TEST_STATE VARIABLE=state VALUE="'stopped'"
        {% else %}
          SET_GCODE_VARIABLE MACRO=_CXM_TEST_STATE VARIABLE=state VALUE="'complete'"
        {% endif %}
        RESPOND TYPE=echo MSG="CXM native test ended at verified EMPTY boundary"
      {% else %}
        {% set t=st.tool_a|int if st.index|int == 0 else st.tool_b|int if st.index|int == 1 else st.tool_c|int %}
        CXM_SELECT_TOOL TOOL={t}
        CXM_SELECT_TOOL TOOL=-1
        _CXM_TEST_ADVANCE
      {% endif %}
    {% endif %}

[gcode_macro _CXM_TEST_ADVANCE]
description: Advance only after verified complete pair
gcode:
    {% set st=printer["gcode_macro _CXM_TEST_STATE"] %}
    {% set count=3 if st.tool_c|int >= 0 else 2 if st.tool_b|int >= 0 else 1 %}
    {% set next_index=(st.index|int + 1) % count %}
    {% set completed=st.completed|int + (1 if next_index == 0 else 0) %}
    {% if printer["gcode_macro _CXM_NATIVE"].current_tool|int != -1 %}
      {action_raise_error("CXM: cannot advance until EMPTY carriage is confirmed")}
    {% endif %}
    CXM_FAST_VERIFY EXPECT=RELEASED
    SET_GCODE_VARIABLE MACRO=_CXM_TEST_STATE VARIABLE=index VALUE={next_index}
    SET_GCODE_VARIABLE MACRO=_CXM_TEST_STATE VARIABLE=completed VALUE={completed}
    UPDATE_DELAYED_GCODE ID=CXM_NATIVE_TEST_STEP DURATION=0.01

[gcode_macro CXM_CAMERA]
description: Capture T0 or change hotends at clearance and return to its optical reference
gcode:
    {% set st=printer["gcode_macro _CXM_NATIVE"] %}
    {% set action=params.ACTION|upper %}
    {% set t=params.TOOL|int %}
    {% set token=params.TOKEN|int %}
    {% set old=st.current_tool|int %}
    {% set h=printer.toolhead %}
    {% set p=h.position %}
    {% set ref=st.camera_reference %}
    {% set x,y,z=(p.x,p.y,p.z) if action=="REFERENCE" else (ref[1],ref[2],ref[3]) %}
    {% set safe=[25,z+5,p.z]|max %}
    {% set gm=printer.gcode_move %}
    {% if action not in ("REFERENCE","CHANGE","RETURN","CAPTURE") or not token or (action!="REFERENCE" and token!=ref[0]) %}
      {action_raise_error("CXM: invalid camera action or stale T0 reference")}
    {% endif %}
    {% if st.ready!=1 or st.fault or printer["gcode_macro _CXM_TEST_STATE"].running or old < -1 or old >= st.tool_count or t < -1 or t >= st.tool_count %}
      {action_raise_error("CXM: camera movement requires known ready native state")}
    {% endif %}
    {% if action=="REFERENCE" and (old!=0 or t!=0) or action in ("RETURN","CAPTURE") and (t<0 or old!=t) or action=="CHANGE" and old!=params.MOUNTED|int %}
      {action_raise_error("CXM: unexpected fitted hotend")}
    {% endif %}
    {% for a in "xyz" %}
      {% if (p[a]-gm.gcode_position[a])|abs > 0.01 %}
        {action_raise_error("CXM: restore the machine coordinate frame before camera alignment")}
      {% endif %}
    {% endfor %}
    {% if "bed_mesh" in printer and printer.bed_mesh.mesh_matrix and printer.bed_mesh.mesh_matrix[0] %}
      {action_raise_error("CXM: clear the active bed mesh before camera alignment")}
    {% endif %}
    {% if not (h.axis_minimum.x+1 <= x <= h.axis_maximum.x-1 and h.axis_minimum.y+1 <= y <= h.axis_maximum.y-1 and [20,h.axis_minimum.z+1]|max <= z <= safe <= h.axis_maximum.z-1) %}
      {action_raise_error("CXM: camera XYZ or lift outside guarded travel")}
    {% endif %}
    {% for n in range(st.tool_count) %}
      {% if st["t" ~ n ~ "_accepted"] and (y < st["t" ~ n ~ "_y"]+st.clearance_y or action=="CHANGE" and p.y < st["t" ~ n ~ "_y"]+st.clearance_y-0.2) %}
        {action_raise_error("CXM: place camera beyond the dock staging line")}
      {% endif %}
    {% endfor %}
    CXM_FAST_VERIFY EXPECT={'PRESSED' if old>=0 else 'RELEASED'}
    {% if action=="REFERENCE" %}
      SET_GCODE_VARIABLE MACRO=_CXM_NATIVE VARIABLE=camera_reference VALUE=[{token},{x},{y},{z}]
    {% elif action=="CHANGE" %}
      SAVE_GCODE_STATE NAME=CXM_CAMERA_LIFT
      G90
      G1 Z{safe} F300
      M400
      RESTORE_GCODE_STATE NAME=CXM_CAMERA_LIFT MOVE=0
      CXM_SELECT_TOOL TOOL={t}
      {% if t>=0 %}
        CXM_CAMERA ACTION=RETURN TOOL={t} TOKEN={token}
      {% endif %}
    {% elif action=="RETURN" %}
      {% if p.z+0.01 < safe %}
        {action_raise_error("CXM: camera transfer height lost")}
      {% endif %}
      SAVE_GCODE_STATE NAME=CXM_CAMERA_RETURN
      G90
      G1 X{x} Y{y} F3000
      M400
      G1 Z{z} F60
      M400
      RESTORE_GCODE_STATE NAME=CXM_CAMERA_RETURN MOVE=0
    {% endif %}


[gcode_macro CXM_DOCK_VERIFY_MOVE]
description: Supervised 50mm/s dock XY calibration; filament sensor is telemetry
variable_version: 2
gcode:
    {% set tool=params.TOOL|default(-1)|int %}
    {% set axis=params.AXIS|default("")|upper %}
    {% set dist=params.DIST|default(0)|float %}
    {% set head=printer.toolhead %}
    {% set pos=head.position %}
    {% set motors=printer.stepper_enable.steppers %}
    {% if tool < 0 or tool > 11 %}
      {action_raise_error("CXM dock verify: invalid selected hotend")}
    {% elif axis not in ("X","Y") %}
      {action_raise_error("CXM dock verify: XY only")}
    {% elif (axis=="Y" and dist|abs not in (0.01,0.1,1.0,100.0)) or (axis=="X" and dist|abs not in (0.01,0.1,1.0)) %}
      {action_raise_error("CXM dock verify: unsupported distance")}
    {% elif "x" not in head.homed_axes or "y" not in head.homed_axes or "z" not in head.homed_axes %}
      {action_raise_error("CXM dock verify: home XYZ before movement")}
    {% elif pos.z|float < 20.0 %}
      {action_raise_error("CXM dock verify: minimum Z20 preflight not met")}
    {% elif printer["gcode_macro _CXM_NATIVE"].jog_revision|int != 2 %}
      {action_raise_error("CXM dock verify: native jog revision 2 required")}
    {% elif printer["gcode_macro _CXM_TEST_STATE"].running|int != 0 %}
      {action_raise_error("CXM dock verify: native tool test running")}
    {% elif "virtual_sdcard" in printer and printer.virtual_sdcard.is_active %}
      {action_raise_error("CXM dock verify: print running")}
    {% elif "pause_resume" in printer and printer.pause_resume.is_paused %}
      {action_raise_error("CXM dock verify: paused print")}
    {% elif "print_stats" in printer and printer.print_stats.state not in (none,"standby","complete","cancelled","error") %}
      {action_raise_error("CXM dock verify: printer busy")}
    {% endif %}
    {% for motor in ("stepper_x","stepper_y","stepper_z","stepper_z1","stepper_z2","stepper_z3") %}
      {% if motor not in motors or motors[motor] != True %}
        {action_raise_error("CXM dock verify: disabled motor " ~ motor)}
      {% endif %}
    {% endfor %}
    {% if axis == "X" %}
      {% set next=pos.x|float+dist %}
      {% set minimum=head.axis_minimum.x|float+1.0 %}
      {% set maximum=head.axis_maximum.x|float-1.0 %}
    {% else %}
      {% set next=pos.y|float+dist %}
      {% set minimum=head.axis_minimum.y|float+1.0 %}
      {% set maximum=head.axis_maximum.y|float-1.0 %}
    {% endif %}
    {% if next < minimum or next > maximum %}
      {action_raise_error("CXM dock verify: move outside guarded physical limits")}
    {% endif %}
    SAVE_GCODE_STATE NAME=CXM_DOCK_VERIFY_MOVE_STATE
    G91
    G1 {axis}{dist} F3000
    M400
    RESTORE_GCODE_STATE NAME=CXM_DOCK_VERIFY_MOVE_STATE MOVE=0
