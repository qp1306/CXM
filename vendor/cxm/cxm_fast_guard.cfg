# CXM RAPID MECHANICAL MODE — native Klipper-only safety gates.
#
# Installed ONCE by scripts/cxm_fast_guard_install.py after dry-run + backups.
# This file is NOT a general T0..T11 selector. Only the CXM service may
# generate supervised G-code after validating the saved, accepted dock data.
# Each invocation is evaluated by Klipper at execution time, not when the
# outer multiline script is submitted. Four calls are made after each M400.
#
# Do not remove the guard or change the 4-sample verification to make it fast.
[gcode_macro CXM_FAST_VERIFY]
description: CXM internal real-time carriage, homing, stepper and position gate
gcode:
    {% set expected=params.EXPECT|default("")|upper %}
    {% if expected not in ("PRESSED","RELEASED") %}
      {action_raise_error("CXM FAST: invalid expected carriage state")}
    {% endif %}
    {% set homed=printer.toolhead.homed_axes %}
    {% if "x" not in homed or "y" not in homed or "z" not in homed %}
      {action_raise_error("CXM FAST: XYZ are not homed — stop and inspect")}
    {% endif %}
    {% set position=printer.toolhead.position %}
    {% if position[2]|float < 20.0 %}
      {action_raise_error("CXM FAST: Z is below 20 mm clearance")}
    {% endif %}
    {% set motors=printer.stepper_enable.steppers %}
    {% for name in ("stepper_x","stepper_y","stepper_z","stepper_z1","stepper_z2","stepper_z3") %}
      {% if name not in motors or motors[name] != True %}
        {action_raise_error("CXM FAST: motor not powered: " ~ name)}
      {% endif %}
    {% endfor %}
    {% if "virtual_sdcard" in printer and printer.virtual_sdcard.is_active %}
      {action_raise_error("CXM FAST: virtual SD printing is active")}
    {% endif %}
    {% if "pause_resume" in printer and printer.pause_resume.is_paused %}
      {action_raise_error("CXM FAST: printer is paused")}
    {% endif %}
    {% if "print_stats" in printer and printer.print_stats.state not in (none,"standby","complete","cancelled","error") %}
      {action_raise_error("CXM FAST: active print detected")}
    {% endif %}
    {% if printer["gcode_button cxm_tool_detect"].state != expected %}
      {action_raise_error("CXM FAST: carriage not " ~ expected ~ " — inspect hotend and dock")}
    {% endif %}
    {% if "MIN_Y" in params and position[1]|float < params.MIN_Y|float - 0.2 %}
      {action_raise_error("CXM FAST: carriage outside safe Y transfer corridor")}
    {% endif %}
    {% if "X" in params and ((position[0]|float - params.X|float)|abs > 0.2) %}
      {action_raise_error("CXM FAST: staging X differs from accepted dock")}
    {% endif %}
    {% if "Y" in params and ((position[1]|float - params.Y|float)|abs > 0.2) %}
      {action_raise_error("CXM FAST: staging Y differs from accepted dock")}
    {% endif %}
    # No G-code is emitted on success. This is a fail-closed safety assertion.
