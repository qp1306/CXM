name: CXM Native Klipper source validation

on:
  push:
    branches:
      - cxm/native-klipper-toolchange-v1
  pull_request:

jobs:
  native-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Jinja
        run: python -m pip install Jinja2
      - name: Python syntax
        run: python -m compileall -q server scripts
      - name: Native controller source + geometry
        run: python scripts/validate_cxm_native.py
      - name: Browser script syntax
        run: |
          node --check web/cxm-multi.js
          node --check web/cxm-native-control.js
