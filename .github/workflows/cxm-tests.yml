name: CXM regression tests
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python configuration and HTTP API tests
        run: python3 -m unittest discover -s tests -v
      - name: JavaScript syntax
        run: node --check web/cxm-settings.js
      - name: Tool card JavaScript syntax
        run: node --check web/cxm-tool-cards.js
      - name: Dock editor JavaScript syntax
        run: node --check web/cxm-dock.js
      - name: Updater, overview, and dock regression tests
        run: node --test tests/test_web_update_safety.cjs tests/test_tool_cards.cjs tests/test_dock_ui.cjs
