name: CXM regression tests
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python configuration and HTTP API tests
        run: python3 -m unittest discover -s tests -v
      - name: JavaScript syntax
        run: node --check web/cxm-settings.js
      - name: Existing updater safety tests
        run: node --test tests/test_web_update_safety.cjs
