name: CXM regression tests
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python configuration and HTTP API tests
        run: python3 -m unittest discover -s tests -v
      - name: JavaScript syntax
        run: node --check web/cxm-settings.js
      - name: Tool states, tool picker and card JavaScript syntax
        run: |
          node --check web/cxm-tool-state.js
          node --check web/cxm-tool-picker.js
          node --check web/cxm-tool-cards.js
      - name: Dock editor JavaScript syntax
        run: node --check web/cxm-dock.js
      - name: Axiscope, Z calibration and colour JavaScript syntax
        run: |
          node --check web/cxm-axiscope.js
          node --check web/cxm-z.js
          node --check web/cxm-tool-style.js
      - name: Updater, overview, dock and Axiscope regression tests
        run: node --test tests/test_web_update_safety.cjs tests/test_tool_cards.cjs tests/test_dock_ui.cjs tests/test_axiscope.cjs tests/test_readiness.cjs tests/test_lockout_ui.cjs tests/test_z_calibration.cjs
