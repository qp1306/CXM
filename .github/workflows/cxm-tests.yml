name: CXM regression tests
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Klipper-compatible Jinja template testing dependency
        run: python3 -m pip install --user 'Jinja2==3.1.6'
      - name: Python configuration and HTTP API tests
        run: python3 -m unittest discover -s tests -v
      - name: All JavaScript syntax
        run: |
          for source in web/*.js; do node --check "$source"; done
      - name: All browser regression tests
        run: node --test tests/*.cjs
